!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pi Sharpshooter: Stress Buster</title>
    <!-- Pi Network SDK -->
    <script src="https://minepi.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Top HUD */
        #hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.7);
            border-bottom: 2px solid #f39c12;
            z-index: 10;
        }
        .stat-box { text-align: center; }
        .stat-label { font-size: 11px; color: #aaa; text-transform: uppercase; }
        .stat-val { font-size: 20px; font-weight: bold; color: #f39c12; }
        #user-badge {
            font-size: 12px;
            background: #6c3483;
            padding: 5px 10px;
            border-radius: 15px;
            border: 1px solid #af7ac5;
        }
        /* Game Arena */
        #arena {
            position: relative;
            flex: 1;
            width: 100%;
            cursor: crosshair;
            overflow: hidden;
        }
        /* Targets */
        .target {
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle, #e74c3c 20%, #fff 21%, #fff 40%, #e74c3c 41%, #fff 60%, #c0392b 61%);
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            transform: translate(-50%, -50%) scale(0);
            animation: popIn 0.2s forwards;
            cursor: pointer;
        }
        .headshot-zone {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #f1c40f;
            border: 2px solid #000;
        }
        @keyframes popIn {
            to { transform: translate(-50%, -50%) scale(1); }
        }
        /* Floating Text (Headshot / +100) */
        .float-text {
            position: absolute;
            font-weight: 900;
            font-size: 22px;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 2px 2px 4px #000;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -120%) scale(1.3); }
        }
        /* Menus & Overlays */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(9, 10, 15, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 20;
        }
        h1 { font-size: 32px; color: #f39c12; margin-bottom: 10px; letter-spacing: 1px; }
        p { color: #ccc; max-width: 320px; margin-bottom: 20px; line-height: 1.4; }
        .btn {
            background: linear-gradient(45deg, #f39c12, #d35400);
            color: #fff;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            margin: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4);
            width: 240px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-pi {
            background: linear-gradient(45deg, #8e44ad, #5b2c6f);
            box-shadow: 0 4px 15px rgba(142, 68, 173, 0.4);
        }
        .hidden { display: none !important; }
        /* Golden Gun Mode */
        .golden-mode { box-shadow: inset 0 0 40px rgba(241, 196, 15, 0.5); }
    </style>
</head>
<body>

    <!-- Top Scoreboard -->
    <div id="hud">
        <div class="stat-box">
            <div class="stat-label">Score</div>
            <div class="stat-val" id="score">0</div>
        </div>
        <div id="user-badge">Guest Player</div>
        <div class="stat-box">
            <div class="stat-label">Time</div>
            <div class="stat-val" id="timer">30s</div>
        </div>
    </div>

    <!-- Shooting Arena -->
    <div id="arena"></div>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay">
        <h1>🎯 PI SHARPSHOOTER</h1>
        <p>Center (Yellow) par shoot karke <b>HEADSHOT (2x Points)</b> maarein aur stress bhagayein!</p>
        <button class="btn btn-pi" onclick="loginWithPi()">🔑 Login with Pi</button>
        <button class="btn" onclick="startGame(false)">🔥 Start Free Match</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="overlay hidden">
        <h1 id="result-title">BOOYAH! MATCH OVER</h1>
        <p style="font-size: 20px; color: #fff;">Final Score: <b id="final-score" style="color:#f39c12;">0</b></p>
        <p style="font-size: 14px;">Headshots: <span id="headshot-count">0</span></p>
        <button class="btn" onclick="startGame(false)">🔄 Play Again</button>
        <button class="btn btn-pi" onclick="buyGoldenSniper()">⚡ Golden Gun (0.01 Pi)</button>
    </div>

    <script>
        // 1. Initialize Pi SDK (Sandbox mode true rakhein testing ke liye)
        const Pi = window.Pi;
        Pi.init({ version: "2.0", sandbox: true });

        let score = 0;
        let headshots = 0;
        let timeLeft = 30;
        let gameInterval, spawnInterval;
        let isGoldenGun = false;
        let piUser = null;

        const arena = document.getElementById('arena');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const userBadge = document.getElementById('user-badge');

        // Sound Synthesizer (Bina external MP3 file ke gunshot sound banata hai)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playShootSound(isHeadshot) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = isHeadshot ? 'triangle' : 'sawtooth';
            osc.frequency.setValueAtTime(isHeadshot ? 800 : 250, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        // 2. Pi Authentication Function
        async function loginWithPi() {
            try {
                const scopes = ['username', 'payments'];
                const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
                piUser = auth.user;
                userBadge.innerText = "@" + piUser.username;
                alert("Swagat hai @" + piUser.username + "! Ab aap Pi rewards ke liye khel sakte hain.");
            } catch (err) {
                console.error(err);
                alert("Pi Browser mein kholein ya Sandbox test karein.");
            }
        }

        function onIncompletePaymentFound(payment) {
            console.log("Incomplete payment:", payment);
        }

        // 3. Pi Payment Function (Golden Sniper Unlock)
        async function buyGoldenSniper() {
            if (!piUser) {
                alert("Pehle 'Login with Pi' par click karein!");
                return;
            }
            try {
                const payment = await Pi.createPayment({
                    amount: 0.01,
                    memo: "Unlock Golden Sniper Gun (Double Points)",
                    metadata: { item: "golden_sniper" }
                }, {
                    onReadyForServerApproval: function(paymentId) {
                        console.log("Ready for approval:", paymentId);
                        // Demo ke liye seedha start kar rahe hain (Live app mein backend approval lagta hai)
                    },
                    onReadyForServerCompletion: function(paymentId, txid) {
                        console.log("Completed:", txid);
                        startGame(true);
                    },
                    onCancel: function(paymentId) { alert("Payment cancel ho gayi."); },
                    onError: function(error, payment) { console.error(error); }
                });
            } catch (err) {
                // Agar sandbox backend nahi hai toh demo mode mein unlock kar dein
                alert("Demo Mode: Golden Sniper Activated!");
                startGame(true);
            }
        }

        // 4. Start Game Logic
        function startGame(golden) {
            isGoldenGun = golden;
            score = 0;
            headshots = 0;
            timeLeft = 30;
            scoreEl.innerText = score;
            timerEl.innerText = timeLeft + "s";
            arena.innerHTML = "";

            if (isGoldenGun) {
                arena.classList.add('golden-mode');
            } else {
                arena.classList.remove('golden-mode');
            }

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');

            // Timer countdown
